name: Stale

on:
  schedule:
    - cron: "0 8 * * 1"  # Every Monday 08:00 UTC
  workflow_dispatch:

jobs:
  stale:
    name: Mark and close stale issues and PRs
    runs-on: ubuntu-latest
    permissions:
      issues: write
      pull-requests: write
    steps:
      - uses: actions/stale@v9
        with:
          stale-issue-message: >
            This issue has been inactive for 60 days and will be closed in 7 days
            unless there is activity. Add a comment or remove the `stale` label to
            keep it open.
          stale-pr-message: >
            This PR has been inactive for 30 days and will be closed in 7 days
            unless there is activity. Push a commit or remove the `stale` label
            to keep it open.
          close-issue-message: "Closing as stale. Re-open if this is still relevant."
          close-pr-message: "Closing as stale. Re-open if this is still relevant."
          days-before-issue-stale: 60
          days-before-pr-stale: 30
          days-before-close: 7
          exempt-issue-labels: "pinned,security"
          exempt-pr-labels: "automated,spec-refresh"
