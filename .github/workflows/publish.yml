name: Publish to PyPI

on:
  release:
    types: [published]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: Build & publish Python SDK
    runs-on: ubuntu-24.04
    environment: pypi-prod
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          # hatch-vcs derives the package version from the git tag, so the build
          # needs the tag and full history, not a shallow single-commit checkout.
          fetch-depth: 0
          ref: ${{ github.event.release.tag_name }}
      - uses: ./.github/actions/setup-python-uv

      - name: Build & validate wheel
        run: make build

      - name: Publish to PyPI
        run: make publish

      - name: Attach build artifacts to the release
        run: gh release upload "${{ github.event.release.tag_name }}" dist/*
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
