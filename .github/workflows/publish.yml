name: Publish to PyPI

on:
  push:
    tags: ["v*.*.*"]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: Build & publish Python SDK
    runs-on: ubuntu-latest
    environment: ${{ contains(github.ref_name, '-rc') && 'pypi-test' || 'pypi-prod' }}
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true
      - run: uv sync

      - name: Apply tag version to pyproject.toml
        run: |
          VERSION="${{ github.ref_name }}"
          sed -i "s/^version = .*/version = \"${VERSION#v}\"/" sdks/python/pyproject.toml

      - name: Build wheel
        run: uv build --package tracss

      - name: Validate wheel
        run: uv run twine check dist/*

      - name: Publish to PyPI (stable) or TestPyPI (release candidate)
        run: |
          if [[ "${{ github.ref_name }}" == *"-rc"* ]]; then
            uv publish --publish-url https://test.pypi.org/legacy/
          else
            uv publish
          fi

      - name: Create GitHub release
        run: |
          PRERELEASE_FLAG=""
          if [[ "${{ github.ref_name }}" == *"-rc"* ]]; then
            PRERELEASE_FLAG="--prerelease"
          fi
          gh release create "${{ github.ref_name }}" dist/* \
            --title "${{ github.ref_name }}" \
            --generate-notes \
            $PRERELEASE_FLAG
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
