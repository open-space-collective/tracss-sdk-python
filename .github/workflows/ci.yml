name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  pull-requests: read

jobs:
  changes:
    name: Detect changed paths
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      fern: ${{ steps.filter.outputs.fern }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            fern:
              - 'fern/**'

  fern-check:
    name: Fern config validation
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm install -g fern-api@5.46.0
      - run: fern check

  spec-freshness:
    name: OpenAPI spec freshness
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
      - name: Fetch current specs
        run: |
          make specs || {
            echo ""
            echo "::error::'make specs' failed. api.tracss.gov may be unreachable or returned an error."
            echo "::error::If this is transient, re-run the job. If persistent, check the TraCSS API status."
            exit 1
          }
      - name: Fail if specs changed
        run: |
          if ! git diff --exit-code fern/openapi/; then
            echo "::error::OpenAPI specs are stale. Run 'make specs' and commit."
            exit 1
          fi

  generate-check:
    name: Generated SDK is up to date
    needs: [fern-check]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm install -g fern-api@5.46.0
      - uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true
      - run: uv sync
      - name: Regenerate SDK
        run: fern generate --group python-sdk --local
        env:
          FERN_TOKEN: ${{ secrets.FERN_TOKEN }}
      - name: Fail if generated files differ from committed
        run: |
          if ! git diff --exit-code sdks/python/; then
            echo "::error::Generated SDK is stale. Run 'make generate' and commit the result."
            exit 1
          fi

  lint-and-test:
    name: Lint & unit tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true
          python-version: ${{ matrix.python-version }}
      - run: uv sync
      - run: make lint
      - run: make test

  security:
    name: Security scan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true
      - run: uv sync
      - run: uv run bandit -r sdks/python/tracss/client.py tests/ -ll
      - run: uv run pip-audit --vulnerability-service osv

  commitlint:
    name: Commit message lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: wagoid/commitlint-github-action@v6
        with:
          configFile: .commitlintrc.yml

  typecheck:
    name: Type checking (mypy)
    needs: [lint-and-test]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true
      - run: uv sync
      - run: make typecheck

  build:
    name: Build & validate wheel
    needs: [lint-and-test, security]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true
      - run: uv sync
      - run: make build
      - run: uv run pip-licenses --fail-on="GPL" --ignore-packages tracss
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  integration:
    name: Integration tests (Prism)
    needs: [lint-and-test]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true
      - run: uv sync
      - name: Install Prism mock server
        run: npm install -g @stoplight/prism-cli@5
      - name: Start Prism mock servers
        run: |
          prism mock fern/openapi/subscriber/openapi.json --port 4010 &
          prism mock fern/openapi/bulk_data/openapi.json  --port 4011 &
          prism mock fern/openapi/metadata/openapi.json   --port 4012 &
          for port in 4010 4011 4012; do
            timeout 30 bash -c \
              "until curl -s --max-time 2 http://localhost:\${port} > /dev/null 2>&1; do sleep 0.5; done" \
              || { echo "Prism did not start on port ${port}" >&2; exit 1; }
          done
      - run: make integration

  docs:
    name: Fern docs preview
    needs: [fern-check, changes]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    if: github.event_name == 'pull_request' && needs.changes.outputs.fern == 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm install -g fern-api@5.46.0
      - name: Preview docs
        run: fern generate --docs --preview
        env:
          FERN_TOKEN: ${{ secrets.FERN_TOKEN }}

  docs-deploy:
    name: Deploy Fern docs
    needs: [fern-check, changes]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    if: github.ref == 'refs/heads/main' && github.event_name == 'push' && needs.changes.outputs.fern == 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm install -g fern-api@5.46.0
      - name: Deploy docs
        run: fern generate --docs
        env:
          FERN_TOKEN: ${{ secrets.FERN_TOKEN }}
