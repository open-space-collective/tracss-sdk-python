name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  pull-requests: read

jobs:
  changes:
    name: Detect changed paths
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      fern: ${{ steps.filter.outputs.fern }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            fern:
              - 'fern/**'

  fern-check:
    name: Fern config validation
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-fern
      - run: fern check

  spec-freshness:
    name: OpenAPI spec freshness
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
      - name: Fetch current specs
        run: |
          make specs || {
            echo ""
            echo "::error::'make specs' failed. api.tracss.gov may be unreachable or returned an error."
            echo "::error::If this is transient, re-run the job. If persistent, check the TraCSS API status."
            exit 1
          }
      - name: Warn on real spec drift (ignoring key order)
        run: |
          for spec in fern/openapi/*/openapi.json; do
            if ! diff <(git show "HEAD:$spec" | jq -S .) <(jq -S . "$spec") > /dev/null; then
              echo "::warning file=$spec::Real spec drift detected (not just key order). Run 'make specs' and commit."
            fi
          done
      - name: Warn on persistent failure
        if: failure()
        run: echo "::warning file=.github/workflows/ci.yml::spec-freshness failed - api.tracss.gov may be unreachable; spec drift is accumulating"

  generate-check:
    name: Generated SDK is up to date
    needs: [fern-check, changes]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    if: |
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'pull_request' && needs.changes.outputs.fern == 'true')
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-fern
      - uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true
      - run: uv sync --frozen
      - name: Regenerate SDK
        run: |
          make generate
          make format
        env:
          FERN_TOKEN: ${{ secrets.FERN_TOKEN }}
      - name: Fail if generated files differ from committed
        run: |
          if ! git diff --exit-code sdks/python/; then
            echo "::error::Generated SDK is stale. Run 'make generate && make format' and commit."
            exit 1
          fi

  lint-and-test:
    name: Lint & unit tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true
          python-version: ${{ matrix.python-version }}
      - run: uv sync --frozen
      - run: make lint
      - run: make test

  security:
    name: Security scan
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true
      - run: uv sync --frozen
      - run: uv run bandit -r sdks/python/tracss/client.py tests/ -ll
      - run: uv run pip-audit --vulnerability-service osv

  commitlint:
    name: Commit message lint
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: wagoid/commitlint-github-action@v6
        with:
          configFile: .commitlintrc.yml

  typecheck:
    name: Type checking (mypy)
    needs: [lint-and-test]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true
      - run: uv sync --frozen
      - run: make typecheck

  build:
    name: Build & validate wheel
    needs: [lint-and-test, security]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true
      - run: uv sync --frozen
      - run: make build
      - run: uv run pip-licenses --fail-on="GPL" --ignore-packages tracss
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  integration:
    name: Integration tests (Prism)
    needs: [lint-and-test]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true
      - run: uv sync --frozen
      - name: Install Prism mock server
        run: npm install -g @stoplight/prism-cli@5.15.11
      - name: Start Prism mock servers
        run: |
          prism mock fern/openapi/subscriber/openapi.json --port 4010 &
          prism mock fern/openapi/bulk_data/openapi.json  --port 4011 &
          prism mock fern/openapi/metadata/openapi.json   --port 4012 &
          for port in 4010 4011 4012; do
            timeout 30 bash -c \
              "until curl -s --max-time 2 http://127.0.0.1:${port} > /dev/null 2>&1; do sleep 0.5; done" \
              || { echo "Prism did not start on port ${port}" >&2; exit 1; }
          done
      - run: make integration
      - name: Stop Prism mock servers
        if: always()
        run: pkill -f "prism mock" 2>/dev/null || true

  docs:
    name: Fern docs preview
    needs: [fern-check, changes]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    if: github.event_name == 'pull_request' && needs.changes.outputs.fern == 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-fern
      - name: Preview docs
        run: fern generate --docs --preview
        env:
          FERN_TOKEN: ${{ secrets.FERN_TOKEN }}

  docs-deploy:
    name: Deploy Fern docs
    needs: [fern-check, changes]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    if: github.ref == 'refs/heads/main' && github.event_name == 'push' && needs.changes.outputs.fern == 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-fern
      - name: Deploy docs
        run: fern generate --docs
        env:
          FERN_TOKEN: ${{ secrets.FERN_TOKEN }}
