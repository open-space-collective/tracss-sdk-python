name: Set up Python + uv
description: Installs uv (with cache) and syncs the frozen workspace environment

inputs:
  python-version:
    description: Python version for uv to provision (defaults to the repo .python-version)
    required: false
    default: ""

runs:
  using: composite
  steps:
    - uses: astral-sh/setup-uv@v4
      with:
        enable-cache: true
        python-version: ${{ inputs.python-version }}
    - run: uv sync --frozen
      shell: bash
