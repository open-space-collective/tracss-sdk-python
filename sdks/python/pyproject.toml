[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[project]
name = "tracss"
dynamic = ["version"]
description = "Python SDK for the TraCSS REST APIs"
authors = [{ name = "Open Space Collective" }]
readme = "tracss/README.md"
requires-python = ">=3.10"
dependencies = [
    "httpx>=0.28.1",
    "pydantic>=2.13.4,<3",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Typing :: Typed",
]

[project.license]
text = "Apache-2.0"

[project.urls]
Homepage = "https://github.com/open-space-collective/tracss-sdk-python"
Repository = "https://github.com/open-space-collective/tracss-sdk-python"
Issues = "https://github.com/open-space-collective/tracss-sdk-python/issues"
Documentation = "https://open-space-collective.docs.buildwithfern.com"

[tool.hatch.build.targets.wheel]
packages = ["tracss"]

[tool.hatch.version]
source = "vcs"
raw-options = { root = "../.." }
